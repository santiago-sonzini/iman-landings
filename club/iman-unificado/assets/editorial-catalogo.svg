<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title description">
<title id="title">Del producto al pedido</title><desc id="description">Cuatro pasos: lista de productos, catálogo digital, envío del pedido por WhatsApp y confirmación del comercio.</desc>
<rect x="1" y="1" width="598" height="738" rx="22" fill="#121212" stroke="#38393e" stroke-width="2"/>
<g font-family="Inter, Arial, Helvetica, sans-serif" fill="#f2f2f4">
<path d="M40 49H77" stroke="#adc4ca" stroke-width="4" stroke-linecap="round"/>
<text x="91" y="56" fill="#a9adb4" font-size="19" font-weight="500" letter-spacing="1.5">IMAN / GUÍAS</text>
<text x="40" y="105" font-size="30" font-weight="500">Del producto al pedido</text>
<rect x="40" y="142" width="520" height="110" rx="13" fill="#1a1b1e" stroke="#38393e" stroke-width="2"/>
<circle cx="76" cy="177" r="17" fill="#adc4ca"/><text x="76" y="184" text-anchor="middle" font-size="20" font-weight="500" fill="#121212">1</text>
<text x="109" y="185" font-size="26" font-weight="500">Lista de productos</text>
<text x="60" y="219" fill="#a9adb4" font-size="22">Nombre, presentación y condiciones</text>
<path d="M300 258v22m-7-7 7 7 7-7" fill="none" stroke="#a3a0ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="285" width="520" height="110" rx="13" fill="#1a1b1e" stroke="#38393e" stroke-width="2"/>
<circle cx="76" cy="320" r="17" fill="#b7abcd"/><text x="76" y="327" text-anchor="middle" font-size="20" font-weight="500" fill="#121212">2</text>
<text x="109" y="328" font-size="26" font-weight="500">Catálogo digital</text>
<text x="60" y="362" fill="#a9adb4" font-size="22">El cliente elige y revisa cantidades</text>
<path d="M300 401v22m-7-7 7 7 7-7" fill="none" stroke="#a3a0ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="428" width="520" height="110" rx="13" fill="#1a1b1e" stroke="#38393e" stroke-width="2"/>
<circle cx="76" cy="463" r="17" fill="#d0bfaf"/><text x="76" y="470" text-anchor="middle" font-size="20" font-weight="500" fill="#121212">3</text>
<text x="109" y="471" font-size="26" font-weight="500">Pedido por WhatsApp</text>
<text x="60" y="505" fill="#a9adb4" font-size="22">El cliente envía el mensaje</text>
<path d="M300 544v22m-7-7 7 7 7-7" fill="none" stroke="#a3a0ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="571" width="520" height="110" rx="13" fill="#1d1b22" stroke="#82768f" stroke-width="2"/>
<circle cx="76" cy="606" r="17" fill="#adc4ca"/><text x="76" y="613" text-anchor="middle" font-size="20" font-weight="500" fill="#121212">4</text>
<text x="109" y="614" font-size="26" font-weight="500">Confirmación del negocio</text>
<text x="60" y="648" fill="#a9adb4" font-size="22">Stock, total y entrega acordados</text>
<text x="40" y="711" font-size="21" fill="#a9adb4">Abrir WhatsApp no confirma una venta.</text>
</g></svg>
