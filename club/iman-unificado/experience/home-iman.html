<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="color-scheme" content="light">

<script>
(function(){
  var root=document.documentElement;root.classList.add('motion','js');
  // Scrolling grows the button into the onboarding (script at the end); without motion the two just sit one under the other.
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)root.classList.add('has-morph');
  // The demos and services that lived on the home are on /info/ now: old links to them land there.
  if(/^#(demos|servicios|promesa|contacto)$/.test(location.hash))location.replace('/info/'+location.hash);
})();
</script>
<style>
/* Home: IMÁN, a background and the button. Scrolling makes the button grow until it is the dark sheet of the onboarding
   (experience/conocer.js), right under it. */
.sr{position:absolute;overflow:hidden;width:1px;height:1px;clip-path:inset(50%);white-space:nowrap}
html{scroll-behavior:auto}
:root{--m:clamp(6px,1vw,14px);--r:clamp(22px,2.6vw,38px);--travel:85svh}

/* The first screen. With the morph it stays put (sticky) while the button grows over the scroll of --travel. */
.has-morph .hm-track{height:calc(100svh + var(--travel))}
.hm{position:relative;display:grid;grid-template-rows:auto 1fr;height:100vh;height:100svh;min-height:540px;overflow:hidden;background:var(--paper)}
.has-morph .hm{position:sticky;top:0}

/* Background: the brand's gradient as a soft glow behind the mark, and the filings around it (v3.js, they follow the pointer) */
.hm-glow{position:absolute;inset:0;pointer-events:none}
.hm-glow i{position:absolute;left:50%;top:42%;width:36vmax;height:30vmax;border-radius:50%;filter:blur(72px);opacity:.5;transform:translate(-50%,-50%)}
.hm-glow i:nth-child(1){background:#82c7d6;margin-left:-17vmax}
.hm-glow i:nth-child(2){background:#b9a3ee;opacity:.55}
.hm-glow i:nth-child(3){background:#e6c5a6;margin-left:17vmax}
.motion .hm-glow i:nth-child(1){animation:drift-a 19s ease-in-out infinite alternate}
.motion .hm-glow i:nth-child(2){animation:drift-b 23s ease-in-out infinite alternate}
.motion .hm-glow i:nth-child(3){animation:drift-c 21s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate(-38%,-62%) scale(1.12)}}
@keyframes drift-b{to{transform:translate(-56%,-40%) scale(.9)}}
@keyframes drift-c{to{transform:translate(-62%,-56%) scale(1.1)}}
.hm .filings{z-index:1;-webkit-mask-image:radial-gradient(ellipse 78% 74% at 50% 46%,#000 30%,#0000 100%);mask-image:radial-gradient(ellipse 78% 74% at 50% 46%,#000 30%,#0000 100%)}

.hm-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:max(18px,env(safe-area-inset-top)) var(--gutter) 10px}
.hm-top .label{display:flex;align-items:center;gap:8px;color:var(--ink)}
.hm-top .label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--grad)}
.hm-top .link{font-size:13.5px}

/* IMÁN, the line and, right under them, the button. --p (0 to 1) is how far the button has grown. */
.hm-center{position:relative;z-index:2;display:grid;place-content:center;justify-items:center;padding:0 var(--gutter) clamp(40px,9vh,96px);text-align:center;transform:scale(calc(1 - var(--p,0)*.06));opacity:calc(1 - var(--p,0)*.7)}
.hm-center h1{margin:0}
.hm-center .logo{--logo-w:min(58vw,600px,56vh * 1.9)}
.hm-line{margin-top:clamp(16px,3vh,30px);font:500 clamp(18px,1.9vw,26px)/1.25 var(--sans);letter-spacing:-.035em;text-wrap:balance}
.hm-cta{position:relative;margin-top:clamp(26px,4.6vh,46px);min-height:66px;padding:10px 10px 10px 34px;gap:22px;font:600 18px/1 var(--sans);letter-spacing:-.02em;box-shadow:0 26px 46px -24px #121212c0}
.hm-cta .arr{width:46px;height:46px}
.hm-cta .arr svg{width:18px;height:18px}
.hm-cta::after{content:'';position:absolute;inset:-7px;border-radius:999px;box-shadow:0 0 0 1.5px #12121229;pointer-events:none}
.motion .hm-cta::after{animation:ring 2.8s var(--ease) infinite}
@keyframes ring{0%{opacity:0;transform:scale(.96)}35%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.is-growing .hm-cta{visibility:hidden}
.hm-note{margin-top:14px;font:500 10.5px/1.5 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-wrap:balance}
.motion .hm-center>*{animation:hm-in 1.1s var(--ease) both}
.motion .hm-center>.hm-line{animation-delay:.15s}
.motion .hm-center>.hm-cta,.motion .hm-center>.hm-note{animation-delay:.3s}
@keyframes hm-in{from{opacity:0;transform:translateY(16px)}}

/* "Deslizá", at the bottom */
.hm-hint{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));display:none;justify-items:center;gap:8px;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transform:translateX(-50%);opacity:calc(1 - var(--p,0)*6)}
.has-morph .hm-hint{display:grid}
.hm-hint i{position:relative;overflow:hidden;width:1.5px;height:30px;border-radius:2px;background:#12121214}
.hm-hint i::after{content:'';position:absolute;left:0;right:0;top:-40%;height:40%;border-radius:2px;background:var(--ink);animation:hint 1.8s var(--ease) infinite}
@keyframes hint{to{top:100%}}

/* The growing button: from the button's box to the sheet's, drawn by the script */
.hm-morph{position:absolute;z-index:4;left:0;top:0;display:none;align-items:center;justify-content:center;gap:22px;background:var(--deep);color:#fff;font:600 18px/1 var(--sans);letter-spacing:-.02em;pointer-events:none;will-change:transform,width,height}
.is-growing .hm-morph{display:flex}
.hm-morph .arr{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--grad);color:var(--ink)}
.hm-morph .arr svg{width:18px;height:18px}
.hm-morph>*{opacity:calc(1 - var(--p,0)*5)}

/* The onboarding's sheet. With the morph it overlaps the first screen's last stretch: transparent and untouchable
   until the button has become it (.is-open); its content shows up as it arrives. */
.cn-sheet{position:relative;z-index:6;min-height:calc(100svh - var(--m));margin:var(--m);border-radius:var(--r);padding-bottom:clamp(30px,6vh,64px);scroll-margin-top:var(--m)}
.has-morph .cn-sheet{margin-top:calc(-100svh + var(--m))}
.has-morph .cn-sheet:not(.is-open){background:transparent;pointer-events:none}
.has-morph .cn-sheet:not(.is-open)::before{opacity:0}
.has-morph .cn-sheet>*{opacity:var(--show,1)}
.cn-sheet .cn-bar{padding-top:clamp(16px,3vh,26px)}
.cn-sheet .nav-brand .logo{--logo-w:64px}
.hm-foot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;max-width:calc(940px + 2*var(--gutter));margin:clamp(30px,6vh,60px) auto 0;padding:0 var(--gutter);font:500 10.5px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-d)}
.hm-foot a:hover{color:#fff}

@media(max-width:640px){
  :root{--travel:75svh}
  .hm-top{padding-top:max(14px,env(safe-area-inset-top))}
  .hm-top .label{font-size:9.5px;letter-spacing:.08em}
  .hm-center{padding-bottom:clamp(56px,10vh,90px)}
  .hm-center .logo{--logo-w:min(78vw,340px)}
  .hm-line{max-width:13em;font-size:19px}
  .hm-glow i{width:62vmax;height:46vmax;filter:blur(56px)}
  .hm-glow i:nth-child(1){margin-left:-14vmax}
  .hm-glow i:nth-child(3){margin-left:14vmax}
  .hm-cta{width:min(100%,340px);justify-content:space-between;min-height:62px;font-size:17.5px}
  .hm-cta::after{inset:-5px}
  .hm-morph{font-size:17.5px}
}
@media(prefers-reduced-motion:reduce){
  .hm-glow i,.hm-cta::after,.hm-hint i::after{animation:none!important}
}
</style>
</head>
<body>
<main>
<div class="hm-track" data-track>
<section class="hm" data-stage aria-label="IMÁN">
<div class="hm-glow" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas class="filings" data-field=".12,.6,.88,.28" data-field-narrow=".5,.16,.5,.8" data-gain=".72" data-ink="#121212" data-field-mouse aria-hidden="true"></canvas>

<header class="hm-top">
<p class="label">Sistemas de clientes con IA</p>
<a class="link" href="/info/">Qué hacemos</a>
</header>

<div class="hm-center">
<h1><span class="logo" aria-hidden="true"></span><span class="sr">IMÁN</span></h1>
<p class="hm-line">Lo que vale un cliente que vuelve.</p>
<a class="btn btn-ink hm-cta" href="#conocer" data-cta>Conocer más<span class="arr" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
<p class="hm-note">Tres pasos: rubro, datos y horario</p>
</div>

<p class="hm-hint" aria-hidden="true">Deslizá<i></i></p>
<div class="hm-morph" data-morph aria-hidden="true"><span>Conocer más</span><span class="arr"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
</section>
</div>

<section class="cn-sheet sheet dark dots cn-dark" id="conocer" data-cn data-sheet aria-label="Conocer IMÁN">
<header class="cn-bar">
<a class="nav-brand" href="#" data-top aria-label="Volver a IMÁN"><span class="logo" aria-hidden="true"></span></a>
<ol class="cn-steps" aria-label="Pasos"><li data-s="0">1 · Rubro</li><li data-s="1">2 · Tus datos</li><li data-s="2">3 · Horario</li></ol>
</header>
<div class="cn-main">
<button class="cn-back" type="button" data-back hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Volver</button>
<div class="cn-view" data-view>
<noscript><h2>Agendá una llamada con IMÁN.</h2><p class="cn-hint">Para elegir el rubro y el horario acá hace falta JavaScript. También podés <a class="link" href="https://agenda.iman.ar/">elegir el horario en la agenda</a> o <a class="link" href="https://wa.me/5493535189997">escribirnos por WhatsApp</a>.</p></noscript>
</div>
</div>
<nav class="hm-foot" aria-label="Más sobre IMÁN"><a href="/info/">Qué hacemos</a><a href="/gauss/">Gauss</a><a href="/diagnostico/">Diagnóstico</a><a href="/recursos/">Guías</a><a href="/privacidad/">Privacidad</a><a href="https://wa.me/5493535189997" target="_blank" rel="noopener">WhatsApp</a></nav>
</section>
</main>

<script src="/assets/experience/v3.js"></script>
<script src="/assets/experience/conocer.js" defer></script>
<script>
/* The button grows into the onboarding. Over the first --travel of scroll the first screen stays put and a black shape
   goes from the button's box to the sheet's; when it gets there the sheet takes over. A scroll that stops halfway
   finishes in the direction it was going, so one swipe (or one turn of the wheel) is enough. */
(function(){
  var root=document.documentElement;
  var track=document.querySelector('[data-track]'),stage=document.querySelector('[data-stage]'),cta=document.querySelector('[data-cta]');
  var morph=document.querySelector('[data-morph]'),sheet=document.querySelector('[data-sheet]');
  var live=root.classList.contains('has-morph');
  var from=null,W=0,H=0,M=0,R=0,top0=0,travel=1,p=-1,frame=0,last=0,dir=1,idle=0,auto=0,touching=false;
  var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  var px=function(name){return parseFloat(getComputedStyle(sheet)[name])||0};

  // Where the sheet sits when the button has become it.
  var target=function(){return sheet.getBoundingClientRect().top+scrollY-px('scrollMarginTop')};
  function measure(){
    W=stage.clientWidth;H=stage.clientHeight;M=px('marginLeft');R=px('borderTopLeftRadius');
    top0=track.getBoundingClientRect().top+scrollY;travel=Math.max(1,track.offsetHeight-H);
    // The button's box as it is at rest: the first screen shrinks a little while the button grows.
    stage.style.setProperty('--p','0');
    var s=stage.getBoundingClientRect(),c=cta.getBoundingClientRect();
    from={x:c.left-s.left,y:c.top-s.top,w:c.width,h:c.height};
    p=-1;update();
  }
  function update(){
    frame=0;
    var q=Math.min(1,Math.max(0,(scrollY-top0)/travel));
    if(q===p)return;p=q;
    var e=ease(q);
    stage.style.setProperty('--p',q.toFixed(4));
    sheet.style.setProperty('--show',Math.min(1,Math.max(0,(q-.55)/.45)).toFixed(3));
    root.classList.toggle('is-growing',q>.002);
    sheet.classList.toggle('is-open',q>.998);
    if(q<=.002)return;
    // From the button to the sheet: the sheet starts M from the top and the sides and runs past the bottom.
    var x=from.x+(M-from.x)*e,y=from.y+(M-from.y)*e,w=from.w+(W-2*M-from.w)*e,h=from.h+(H+R-M-from.h)*e;
    var rt=from.h/2+(R-from.h/2)*e,rb=from.h/2*(1-e);
    morph.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    morph.style.width=w.toFixed(1)+'px';morph.style.height=h.toFixed(1)+'px';
    morph.style.borderRadius=rt.toFixed(1)+'px '+rt.toFixed(1)+'px '+rb.toFixed(1)+'px '+rb.toFixed(1)+'px';
  }
  function go(y,smooth){auto=Date.now();window.scrollTo({top:y,behavior:smooth?'smooth':'auto'})}
  function settle(){
    // Halfway through the growing, and nobody scrolling: finish the way it was going.
    if(touching||Date.now()-auto<900||p<=.002||p>=.998)return;
    go(dir>0?target():top0,true);
  }
  function onScroll(){
    var y=scrollY;if(y!==last){dir=y>last?1:-1;last=y}
    if(!frame)frame=requestAnimationFrame(update);
    clearTimeout(idle);idle=setTimeout(settle,140);
  }

  // The button, the logo on the sheet and #conocer in the address take the same way.
  var open=function(smooth){
    go(target(),smooth&&live);
    var title=function(){var t=document.getElementById('cn-title');if(t)t.focus({preventScroll:true})};
    setTimeout(title,live&&smooth?800:0);
  };
  cta.addEventListener('click',function(e){e.preventDefault();open(true)});
  document.querySelector('[data-top]').addEventListener('click',function(e){e.preventDefault();go(0,live)});

  if(live){
    measure();
    addEventListener('scroll',onScroll,{passive:true});
    // A finger still on the screen is still deciding: finish only after it lets go.
    addEventListener('touchstart',function(){touching=true;clearTimeout(idle)},{passive:true});
    addEventListener('touchend',function(){touching=false;clearTimeout(idle);idle=setTimeout(settle,140)},{passive:true});
    addEventListener('touchcancel',function(){touching=false},{passive:true});
    // The button rises into place when the page opens: measure it again once it is there.
    cta.addEventListener('animationend',measure);
    addEventListener('resize',function(){cancelAnimationFrame(frame);frame=0;measure()});
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
  }
  // ?rubro= (ads by rubro) and #conocer open straight on the onboarding.
  if(location.hash==='#conocer'||new URLSearchParams(location.search).has('rubro'))requestAnimationFrame(function(){open(false)});
})();
</script>
</body>
</html>
